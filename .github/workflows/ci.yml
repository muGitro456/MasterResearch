name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install \
            numpy \
            tqdm \
            requests \
            openpyxl \
            matplotlib \
            pandas \
            pytest \
            pytest-cov \
            pytest-mock

      - name: Run tests
        run: pytest tests/ --cov=src --cov-report=term-missing
