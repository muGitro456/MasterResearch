[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "masterresearch"
version = "1.0.0"
description = "多目的PSO最適化アルゴリズムのシミュレーション"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.2",
    "pandas>=2.3",
    "tqdm>=4.68",
    "matplotlib>=3.10",
    "pyyaml>=6.0",
]

[project.scripts]
masterresearch = "src.__main__:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
src = ["configs/*.yaml"]
