[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "masterresearch"
dynamic = ["version"]
description = "MOPSOアルゴリズムのシミュレーション"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.2",
    "pandas>=2.3",
    "tqdm>=4.68",
    "matplotlib>=3.10",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
docs = [
    "sphinx>=8.1",
    "furo>=2025.12",
]

[project.scripts]
masterresearch = "masterresearch.__main__:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["masterresearch*"]

[tool.setuptools.package-data]
masterresearch = ["configs/*.yaml"]

[tool.setuptools.dynamic]
version = {file = "VERSION.txt"}
